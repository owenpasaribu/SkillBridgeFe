<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#F3EADB">
<title>Sign Up — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { width: 100%; max-width: 480px; }
  .auth-head { text-align: center; margin-bottom: 28px; }
  .auth-foot { text-align: center; margin-top: 20px; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <a href="index.html" class="brand" style="justify-content:center;">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none"><path d="M4 21C4 21 9 13 16 13C23 13 28 21 28 21" stroke="#55662E" stroke-width="2.5" stroke-linecap="round"/><line x1="8" y1="21" x2="8" y2="25" stroke="#55662E" stroke-width="2.5" stroke-linecap="round"/><line x1="16" y1="21" x2="16" y2="26" stroke="#D9963F" stroke-width="2.5" stroke-linecap="round"/><line x1="24" y1="21" x2="24" y2="25" stroke="#55662E" stroke-width="2.5" stroke-linecap="round"/><line x1="4" y1="25" x2="28" y2="25" stroke="#2E271E" stroke-width="2.5" stroke-linecap="round"/></svg>
        SkillBridge
      </a>
      <h2 style="margin-top:16px;">Create your new account</h2>
      <p class="text-sm">Takes less than 2 minutes.</p>
    </div>

    <div class="card">
      <form id="registerForm">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required placeholder="Your name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="name@university.edu">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="field">
          <label for="university">University</label>
          <input type="text" id="university" required placeholder="University name">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="major">Major</label>
            <input type="text" id="major" required placeholder="Example: Computer Science">
          </div>
          <div class="field">
            <label for="semester">Semester</label>
            <input type="number" id="semester" min="1" max="14" required placeholder="6">
          </div>
        </div>
        <div class="field">
          <label for="graduationYear">Expected Graduation Year</label>
          <input type="number" id="graduationYear" min="2024" max="2035" required placeholder="2027">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account &amp; Continue to Onboarding</button>
      </form>
    </div>

    <p class="auth-foot text-soft">Already have an account? <a href="login.html">Sign in here</a></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/admin-store.js"></script>
<script src="js/storage.js"></script>
<script src="js/scoring.js"></script>
<script src="js/api-mock.js"></script>
<script src="js/api-live.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
