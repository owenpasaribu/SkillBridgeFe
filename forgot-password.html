<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#F3EADB">
<title>Forgot Password — SkillBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { width: 100%; max-width: 420px; }
  .auth-head { text-align: center; margin-bottom: 28px; }
  .auth-foot { text-align: center; margin-top: 20px; font-size: 0.9rem; }
  .success-box { display:none; background: var(--color-success-soft); color: var(--color-success); padding:16px 18px; border-radius: var(--radius-md); font-size:0.9rem; margin-bottom:16px; }
  .success-box.is-visible { display:block; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <a href="index.html" class="brand" style="justify-content:center;">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none"><path d="M4 21C4 21 9 13 16 13C23 13 28 21 28 21" stroke="#55662E" stroke-width="2.5" stroke-linecap="round"/><line x1="8" y1="21" x2="8" y2="25" stroke="#55662E" stroke-width="2.5" stroke-linecap="round"/><line x1="16" y1="21" x2="16" y2="26" stroke="#D9963F" stroke-width="2.5" stroke-linecap="round"/><line x1="24" y1="21" x2="24" y2="25" stroke="#55662E" stroke-width="2.5" stroke-linecap="round"/><line x1="4" y1="25" x2="28" y2="25" stroke="#2E271E" stroke-width="2.5" stroke-linecap="round"/></svg>
        SkillBridge
      </a>
      <h2 style="margin-top:16px;">Forgot Password</h2>
      <p class="text-sm">Self-service password reset is not available yet.</p>
    </div>

    <div class="card">
      <p class="text-sm">If you cannot sign in, please contact your administrator and ask them to help you regain access to your account.</p>
      <a href="login.html" class="btn btn-primary btn-block">Back to Sign in</a>
    </div>
  </div>
</div>
</body>
</html>
